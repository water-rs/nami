[package]
name = "nami-core"
version = "0.3.3"
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
[dependencies]
kurbo = { version = "0.13", default-features = false, features = ["libm"], optional = true }

[lints]
workspace = true

[features]
default = ["std"]
std = ["kurbo?/std"]
# Reactive-graph introspection for development tooling. Adds an `Origin` to every
# state-owning signal node and dispatches lifecycle/notification events to a
# thread-local observer. Off by default; requires `std` for the thread-local.
observability = ["std"]
# Constant `Signal` implementations for kurbo's geometry types, so that APIs taking
# `impl Signal<Output = Affine>` accept a plain value.
kurbo = ["dep:kurbo"]
